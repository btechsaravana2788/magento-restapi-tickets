<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Magento Admin support ticket conversation</title>
  <desc id="desc">A mockup of a support ticket detail page with customer and staff replies and controls to update priority, status, and add a reply.</desc>
  <rect width="1200" height="760" fill="#f4f4f4"/>
  <rect width="1200" height="56" fill="#242526"/>
  <text x="25" y="36" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Magento Admin</text>
  <text x="1050" y="35" fill="#ddd" font-family="Arial, sans-serif" font-size="13">Store View  ▾</text>
  <rect y="56" width="210" height="704" fill="#2d2e30"/>
  <text x="24" y="100" fill="#bbb" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">MENU</text>
  <text x="24" y="148" fill="#eee" font-family="Arial, sans-serif" font-size="15">Dashboard</text>
  <text x="24" y="192" fill="#eee" font-family="Arial, sans-serif" font-size="15">Sales</text>
  <text x="24" y="236" fill="#eee" font-family="Arial, sans-serif" font-size="15">Catalog</text>
  <rect x="0" y="258" width="210" height="44" fill="#514943"/>
  <rect x="0" y="258" width="4" height="44" fill="#eb5202"/>
  <text x="24" y="286" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Support Tickets</text>
  <text x="242" y="103" fill="#303030" font-family="Arial, sans-serif" font-size="13">Marketing / Support Tickets / #1042</text>
  <text x="242" y="150" fill="#303030" font-family="Arial, sans-serif" font-size="28" font-weight="700">Ticket #1042</text>
  <rect x="240" y="177" width="920" height="166" fill="#fff" stroke="#d6d6d6"/>
  <text x="266" y="211" fill="#333" font-family="Arial, sans-serif" font-size="17" font-weight="700">Ticket details</text>
  <line x1="260" y1="228" x2="1140" y2="228" stroke="#e5e5e5"/>
  <text x="270" y="258" fill="#777" font-family="Arial, sans-serif" font-size="12">SUBJECT</text>
  <text x="420" y="258" fill="#333" font-family="Arial, sans-serif" font-size="14">Delivery estimate for order</text>
  <text x="270" y="290" fill="#777" font-family="Arial, sans-serif" font-size="12">ORDER / CUSTOMER</text>
  <text x="420" y="290" fill="#333" font-family="Arial, sans-serif" font-size="14">#800012  /  Customer #219</text>
  <text x="750" y="258" fill="#777" font-family="Arial, sans-serif" font-size="12">STATUS</text>
  <rect x="835" y="240" width="115" height="30" rx="2" fill="#fff" stroke="#adadad"/>
  <text x="849" y="260" fill="#444" font-family="Arial, sans-serif" font-size="13">In Progress ▾</text>
  <text x="750" y="300" fill="#777" font-family="Arial, sans-serif" font-size="12">PRIORITY</text>
  <rect x="835" y="282" width="115" height="30" rx="2" fill="#fff" stroke="#adadad"/>
  <text x="849" y="302" fill="#444" font-family="Arial, sans-serif" font-size="13">High ▾</text>
  <rect x="240" y="363" width="920" height="270" fill="#fff" stroke="#d6d6d6"/>
  <text x="266" y="397" fill="#333" font-family="Arial, sans-serif" font-size="17" font-weight="700">Conversation</text>
  <line x1="260" y1="414" x2="1140" y2="414" stroke="#e5e5e5"/>
  <rect x="274" y="432" width="815" height="76" rx="4" fill="#f5f7fa"/>
  <text x="294" y="455" fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="700">Customer</text>
  <text x="1020" y="455" text-anchor="end" fill="#888" font-family="Arial, sans-serif" font-size="11">Oct 15, 2026 9:14 AM</text>
  <text x="294" y="481" fill="#444" font-family="Arial, sans-serif" font-size="13">Could you share the delivery estimate for this order?</text>
  <rect x="364" y="520" width="725" height="88" rx="4" fill="#fff4eb" stroke="#f5ddc9"/>
  <text x="384" y="544" fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="700">Staff reply</text>
  <text x="1020" y="544" text-anchor="end" fill="#888" font-family="Arial, sans-serif" font-size="11">Oct 15, 2026 10:02 AM</text>
  <text x="384" y="571" fill="#444" font-family="Arial, sans-serif" font-size="13">Your order is on its way. We will send tracking details shortly.</text>
  <rect x="240" y="653" width="920" height="73" fill="#fff" stroke="#d6d6d6"/>
  <text x="266" y="680" fill="#777" font-family="Arial, sans-serif" font-size="12">REPLY TO CUSTOMER</text>
  <rect x="266" y="688" width="700" height="25" rx="2" fill="#fff" stroke="#c4c4c4"/>
  <text x="278" y="706" fill="#999" font-family="Arial, sans-serif" font-size="12">Write a public reply...</text>
  <rect x="988" y="681" width="146" height="35" rx="2" fill="#eb5202"/>
  <text x="1061" y="704" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Save Ticket</text>
  <text x="600" y="748" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="11">ILLUSTRATIVE UI MOCKUP — NOT A LIVE MAGENTO SCREENSHOT</text>
</svg>
